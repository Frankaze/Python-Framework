[project]
name = "framework-utility"
version = "0.0.0"
description = "Reusable runtime utilities for Python applications."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["framework-common"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
framework-common = { path = "../framework_common", editable = true }
