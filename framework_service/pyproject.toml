[project]
name = "framework-service"
version = "0.1.0"
description = "Reusable service and mapper foundations for Python applications."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "framework-repository",
    "sqlalchemy>=2.1.4",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
framework-repository = { path = "../framework_repository", editable = true }
