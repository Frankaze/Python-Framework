[project]
name = "framework-service"
version = "0.0.0"
description = "Reusable service and mapper foundations for Python applications."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "framework-common",
    "framework-repository",
    "framework-utility",
    "sqlalchemy",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
framework-common = { path = "../framework_common", editable = true }
framework-repository = { path = "../framework_repository", editable = true }
framework-utility = { path = "../framework_utility", editable = true }
