[project]
name = "framework-repository"
version = "0.1.0"
description = "Reusable repository and unit-of-work foundations for Python applications."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "framework-common",
    "psycopg[binary]==3.3.9",
    "sqlalchemy==2.1.8",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
framework-common = { path = "../framework_common", editable = true }
